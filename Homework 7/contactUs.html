<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel=" stylesheet" href="style.css">

</head>
<body class="contact-page">

    <nav>
        <a href="homepage.html">Home</a>
        <a href="ShortStory.html">Short Story</a>
        <a href="contactUs.html">Contact Us</a>
    </nav>
<main class="contact-container">
    <h1 style="color: green; font-family: Arial, sans-serif; font-size: 2em;">Contact Us</h1>
    <form>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" class="form-control" required>
        <br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" class="form-control" required>

        <p style="background-color: rgb(248, 81, 84); color: rgb(10, 4, 71); font-weight: bold;">
            Do you accept the terms of agreement?
        </p>

        <div class="radio-options">
            <input type="radio" id="termsYes" name="terms" value="yes" required>
            <label for="termsYes">Yes</label>

            <input type="radio" id="termsNo" name="terms" value="no" required>
            <label for="termsNo">No</label>
        </div>
        <br><br>
        <input type="submit" value="Submit" class="btn btn-success">
    </form>
</main>
</body>
</html>
